<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login - Sanjay Electronics</title>

    <link rel="stylesheet" href="CSS/style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>

        body {

            background: #f5f5f5;

            font-family: 'Poppins', sans-serif;

        }

        .admin-login-container {

            width: 100%;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;

        }

        .admin-box {

            width: 100%;

            max-width: 450px;

            background: white;

            padding: 40px;

            border-radius: 15px;

            box-shadow: 0 4px 20px rgba(0,0,0,0.1);

        }

        .admin-box h1 {

            text-align: center;

            color: #ff6600;

            margin-bottom: 10px;

        }

        .admin-box p {

            text-align: center;

            color: #666;

            margin-bottom: 30px;

        }

        .form-group {

            margin-bottom: 20px;

        }

        .form-group label {

            display: block;

            margin-bottom: 8px;

            font-weight: 500;

        }

        .form-control {

            width: 100%;

            padding: 14px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 16px;

        }

        .btn-login {

            width: 100%;

            padding: 14px;

            background: #ff6600;

            color: white;

            border: none;

            border-radius: 8px;

            font-size: 18px;

            cursor: pointer;

            transition: 0.3s;

        }

        .btn-login:hover {

            background: #e65c00;

        }

        .error-message {

            color: red;

            margin-top: 15px;

            text-align: center;

        }

        table {

            width: 100%;

            border-collapse: collapse;

            background: white;

            margin-top: 30px;

            border-radius: 10px;

            overflow: hidden;

        }

        table th {

            background: #0b3d91;

            color: white;

            padding: 15px;

            text-align: left;

        }

        table td {

            padding: 12px;

            border-bottom: 1px solid #ddd;

        }

        .hidden {

            display: none;

        }

        .admin-panel {

            padding: 40px;

        }

        .admin-panel h2 {

            margin-bottom: 20px;

            color: #0b3d91;

        }

    </style>

</head>

<body>
<a href="index.html"
   style="
   position:fixed;
   top:20px;
   left:20px;
   background:#ff6600;
   color:white;
   padding:12px 20px;
   border-radius:8px;
   text-decoration:none;
   font-weight:600;
   z-index:999;
   ">

   ← Back Home

</a>
    <!-- LOGIN SECTION -->

    <div class="admin-login-container" id="login-section">

        <div class="admin-box">

            <h1>Admin Login</h1>

            <p>Sanjay Electronics Owner Panel</p>

            <div class="form-group">

                <label>Email</label>

                <input type="email"
                    id="admin-email"
                    class="form-control"
                    placeholder="Enter admin email">

            </div>

            <div class="form-group">

                <label>Password</label>

                <input type="password"
                    id="admin-password"
                    class="form-control"
                    placeholder="Enter password">

            </div>

            <button class="btn-login" onclick="loginAdmin()">
                Login
            </button>

            <div class="error-message" id="error-message"></div>

        </div>

    </div>

    <!-- ADMIN PANEL -->

    <div class="admin-panel hidden" id="admin-panel">

        <h2>Customer Booking Data</h2>

        <table>

            <thead>

                <tr>

                    <th>Full Name</th>

                    <th>Phone</th>

                    <th>Village</th>

                    <th>Service</th>

                    <th>Date</th>

                    <th>Time</th>

                    <th>Address</th>
                    <th>Status</th>

                    <th>Action</th>

                </tr>

            </thead>

            <tbody id="booking-data">

            </tbody>

        </table>

    </div>

    <script>

        function loginAdmin() {

            const email = document.getElementById('admin-email').value;

            const password = document.getElementById('admin-password').value;

            if (

                email === 'pradipsonawane4406@gmail.com' &&
                password === 'Sanjay@123'

            ) {

                document.getElementById('login-section').classList.add('hidden');

                document.getElementById('admin-panel').classList.remove('hidden');

                loadBookings();

            }

            else {

                document.getElementById('error-message').innerText = 'Invalid Email or Password';

            }

        }

        function loadBookings() {

            fetch('/get-bookings')

                .then(response => response.json())

                .then(data => {

                    const table = document.getElementById('booking-data');

                    table.innerHTML = '';

                    data.forEach((booking, index) => {

    table.innerHTML += `

        <tr>

            <td>${booking.fullname}</td>

            <td>${booking.phone}</td>

            <td>${booking.village}</td>

            <td>${booking.service}</td>

            <td>${booking.date}</td>

            <td>${booking.time}</td>

            <td>${booking.address}</td>

            <td>${booking.status}</td>

            <td>

    ${booking.status === 'Pending'

    ? `

        <button onclick="updateStatus(${index}, 'Done')">

            Done

        </button>

        <button onclick="updateStatus(${index}, 'Cancelled')">

            Cancel

        </button>

      `

    : 'Completed'}

</td>

        </tr>

    `;

});

                });

        }
function updateStatus(index, status) {

    fetch('/update-status', {

        method: 'POST',

        headers: {

            'Content-Type': 'application/json'

        },

        body: JSON.stringify({

            index,
            status

        })

    })

    .then(response => response.json())

    .then(data => {

        loadBookings();

    });

}

    </script>

</body>

</html>
